project:
  type: book
  output-dir: _book

book:
  title: "Prompt engineering w badaniach naukowych"
  subtitle: "Od pojedynczych zapytań do agentów AI i inżynierii kontekstu"
  #author: "Jarosław Chodak"
  # cover-image wyłączone: Quarto renderuje okładkę jako float (opływany tekstem),
  # co w Safari rozpycha tekst i nachodzi na g01-hero.png. Książka zaczyna się od Przedmowy + g01-hero.
  # (Ewentualny wariant: okładka landscape jako pełnej szerokości baner przed Przedmową — bez opływania.)
  # cover-image: images/cover.png
  date: today
  date-format: "YYYY-MM-DD"
  language: pl
  search: true
  reader-mode: true
  page-footer:
    left: "Kurs · Prompt engineering w badaniach naukowych · 3 dni / 24h"
    right: |
      Repozytorium na [GitHub](https://github.com/jaroslawchodak/course-ai-research)
  sidebar:
    style: docked
    collapse-level: 2
    border: true
  chapters:
    - index.qmd
    - 01-fundament.qmd
    - 02-zapytania.qmd
    - 03-halucynacje-dane.qmd
    - 04-kontekst.qmd
    - 05-dane-rag.qmd
    - 06-notebooklm.qmd
    - 07-deep-research.qmd
    - 08-lokalne-llm.qmd
    - 09-agenci-srodowiska.qmd
    - 10-clustering-demo.qmd
    - 11-etyka.qmd
    - 12-integracja-ewaluacja.qmd

format:
  html:
    # Styl „Claude Design / japandi" — jednolita, ciepła, kremowa paleta (zob. theme/custom.scss).
    # Świadomie bez trybu ciemnego, by utrzymać spójną, matową estetykę kremu.
    theme: [litera, theme/custom.scss]
    toc: true
    toc-depth: 3
    toc-title: "Na tej stronie"
    number-sections: true
    number-depth: 2
    smooth-scroll: true
    code-overflow: wrap
    code-copy: true
    fontsize: "1.05em"
    linkcolor: "#0b3d91"
    mainfont: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    monofont: "JetBrains Mono, 'Fira Code', 'SF Mono', Consolas, monospace"
    mermaid:
      theme: neutral

execute:
  echo: true
  eval: false

lang: pl
